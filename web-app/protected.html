<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILLI — Protected Person</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-root">
  <div class="dashboard-full-wrapper">
    <div id="billi-nav"></div>
    <main class="dashboard-main-container" style="max-width:760px; margin:0 auto;" id="main-host"></main>
  </div>

  <!-- FEIGN-CANCEL SCREEN (duress branch — deliberately calm and believable) -->
  <div class="feign-cancel-screen" id="feign-screen" style="display:none;">
    <div style="font-size:3rem;">✓</div>
    <h2 style="color:#e2e8f0; font-weight:600;">Emergency cancelled</h2>
    <p class="text-muted" style="font-size:0.9rem; max-width:320px;">Your alert has been dismissed. No contacts were notified.</p>
    <button class="btn btn-secondary margin-top" onclick="closeFeign()">Done</button>
  </div>

  <script src="billi-adapters.js"></script>
  <script src="billi-core.js"></script>
  <script>
    if (!Billi.requireSetup()) throw new Error('redirect');
    Billi.renderNav('protected.html');

    const S = Billi.state;
    const p = S.protectedPerson || {};
    let pinBuffer = '';
    let holdTimer = null, holdStart = 0;

    function render() {
      const active = Billi.getActiveIncident();
      const v = active ? Billi.incidentView(active) : null;
      const c = S.contract || {};
      const readyRow = (label, ok, note) => `
        <div class="core-action-row margin-top-xs">
          <span style="color:#e2e8f0; font-size:0.85rem;">${label}</span>
          <span class="${ok === true ? 'state-ok' : ok === 'warn' ? 'state-wait' : 'state-unavail'}">${note}</span>
        </div>`;

      /* NOTE (duress rule): the protected person's screen NEVER shows the red
         hazard treatment guardians see. If duress is active, this view keeps
         pretending the incident was cancelled. */
      const showAsCalm = active && active.duress;

      document.getElementById('main-host').innerHTML = `
        <section class="text-center margin-top">
          <div class="person-avatar-circle" style="margin:0 auto;">${Billi.initials(p.name)}</div>
          <h1 style="color:#fff; font-size:1.5rem; margin-top:0.5rem;">${p.name || 'Protected person'}</h1>
          ${showAsCalm
            ? `<span class="badge badge-green margin-top-xs">Billi is armed · Everything looks normal</span>`
            : active && v.pendingConfirmation
              ? `<span class="badge badge-amber margin-top-xs">CONFIRMING · Trusted Network not yet told</span>`
              : active
              ? `<span class="badge badge-red margin-top-xs">EMERGENCY ACTIVE · ${Billi.LIFECYCLE.indexOf(v.lifecycle) >= 2 ? 'Help is aware' : 'Alerting your Trusted Network'}</span>`
              : `<span class="armed-badge-green margin-top-xs">● BILLI ARMED · PROTECTING YOU</span>`}
        </section>

        ${active && !showAsCalm && v.pendingConfirmation ? `
        <!-- ACCIDENTAL-TRIGGER SAFE-FAIL: sensor-inferred triggers (fall, crash,
             geofence exit, acoustic distress) can false-positive — a phone in a
             backpack most commonly. Location + audio capture already started
             locally; nothing has gone to the Trusted Network yet. Silence here
             fails safe TOWARD escalation, matching how the 45s guardian window
             already behaves — it never fails safe toward cancellation. -->
        <section class="card margin-top text-center" style="padding:1.3rem; border:2px solid rgba(245,158,11,0.6); background:rgba(245,158,11,0.06);">
          <div style="font-size:2.2rem;">⏳</div>
          <div style="color:#fbbf24; font-weight:700; font-size:1rem; margin-top:0.3rem;">${v.inc.triggerMethod} detected on ${v.inc.triggerDevice}</div>
          <p class="text-muted" style="font-size:0.8rem; margin-top:0.3rem;">This is a sensor-inferred trigger, not a deliberate one — it can be wrong (dropped in a bag, a hard bump, background noise). Your Trusted Network has <strong style="color:#e2e8f0;">not</strong> been told anything yet. Location and audio are already recording as evidence either way.</p>
          <div style="font-size:2rem; font-weight:800; color:#fbbf24; margin-top:0.5rem;">${v.confirmSecondsLeft}s</div>
          <p class="text-muted" style="font-size:0.7rem;">If nothing is tapped, Billi treats this as real and alerts your network when the countdown ends — silence escalates, it never cancels.</p>
          <div class="grid grid-2 margin-top" style="gap:0.6rem;">
            <button class="btn btn-danger" style="padding:0.9rem; font-size:0.85rem;" onclick="confirmReal()">🚨 Yes, I need help</button>
            <button class="btn btn-secondary" style="padding:0.9rem; font-size:0.85rem;" onclick="dismissFalse()">✓ False alarm — cancel now</button>
          </div>
        </section>` : ''}

        ${active && !showAsCalm && !v.pendingConfirmation ? `
        <section class="card margin-top" style="padding:1.1rem; border:1px solid rgba(99,102,241,0.4);">
          <div class="panel-section-title" style="font-size:0.9rem;">What Billi is doing right now</div>
          ${readyRow('📍 Location', true, v.core.gps)}
          ${readyRow('🎙 Audio evidence', true, v.core.audio)}
          ${readyRow('🎥 Video', false, v.core.video)}
          ${readyRow('👥 Trusted Network', true, v.core.network)}
          ${(c.spokenMode !== 'silent') ? `
          <div class="card margin-top-xs" style="padding:0.7rem 0.9rem; background:rgba(99,102,241,0.08);">
            <div class="text-muted" style="font-size:0.68rem; text-transform:uppercase; letter-spacing:0.05em;">Billi speaks (${c.spokenMode} mode)</div>
            <div style="color:#e2e8f0; font-size:0.88rem; margin-top:0.2rem;">
              ${c.spokenMode === 'deterrent'
                ? '"Billi emergency protocol is active. Location and incident information are being transmitted."'
                : v.contacts.some(x => /Responding/i.test(x.status))
                  ? `"${(v.contacts.find(x => /Responding/i.test(x.status)) || {}).name || 'Your guardian'} is responding."`
                  : v.core.network === 'DELIVERED' ? '"Your mother received your alert."' : '"Your alert is being sent."'}
            </div>
          </div>` : `<div class="text-muted margin-top-xs" style="font-size:0.72rem;">Silent mode — no outward audio. Your guardians continue receiving updates.</div>`}

          ${v.contacts.filter(x => x.alertState === 'ACKNOWLEDGED' || /Responding/i.test(x.status)).map(x =>
            `<div class="margin-top-xs" style="font-size:0.82rem; color:#34d399;">✓ ${x.name} — ${x.status}</div>`).join('')}
        </section>

        <!-- CANCELLATION (PIN pad, or a plain fallback if no PIN was set) -->
        <section class="card margin-top" style="padding:1.1rem; text-align:center;">
          <div class="panel-section-title" style="font-size:0.9rem;">Cancel emergency</div>
          ${S.pins.normal ? `
          <p class="text-muted" style="font-size:0.75rem;">Enter your cancellation PIN. This screen looks identical for both PINs.</p>
          <div class="pin-dots">${[0,1,2,3].map(i => `<span class="pin-dot ${i < pinBuffer.length ? 'filled' : ''}"></span>`).join('')}</div>
          <div class="pin-pad">
            ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<span></span>' :
              `<button class="pin-key" onclick="pinKey('${k}')">${k}</button>`).join('')}
          </div>` : `
          <p class="text-muted" style="font-size:0.78rem;">No cancellation PIN was set up for this account, so tap below to mark this safe. <a href="admin.html" style="color:#a5b4fc;">Add a PIN in Settings</a> for coercion-safe cancellation.</p>
          <button class="btn btn-primary margin-top-xs" style="width:100%; padding:0.85rem;" onclick="cancelNoPin()">✓ This was a false alarm — I'm safe</button>`}
        </section>` : ''}

        ${!active ? `
        <section class="grid grid-2 margin-top" style="gap:0.75rem; align-items:start;">
          <div class="card" style="padding:1.1rem;">
            <div class="panel-section-title" style="font-size:0.9rem;">Billi is ready</div>
            ${readyRow('📍 GPS', c.gps, c.gps ? 'READY' : 'NOT AUTHORIZED')}
            ${readyRow('🎙 Audio', c.audio, c.audio ? 'READY' : 'NOT AUTHORIZED')}
            ${readyRow('🎥 Video', false, 'UNAVAILABLE IN PROTOTYPE')}
            ${readyRow('📶 BLE & communication', c.bleScanning, c.bleScanning ? 'READY (SIMULATED)' : 'OFF')}
            ${readyRow('👥 Trusted Network sync', S.contacts.length >= 2, `${S.contacts.length} CONTACTS`)}
            ${readyRow('🗣 Safe words', S.voice.state === 'Enrolled', S.voice.state === 'Enrolled' ? `${S.voice.safeWords.length} ENROLLED` : S.voice.state.toUpperCase())}
            ${readyRow('📍 Safe zone', S.zones.length > 0, S.zones[0] ? `INSIDE "${S.zones[0].name.toUpperCase()}" (SIMULATED)` : 'NONE SET')}
          </div>

          <div class="card text-center" style="padding:1.1rem;">
            <div class="panel-section-title" style="font-size:0.9rem;">Emergency SOS</div>
            <p class="text-muted" style="font-size:0.72rem;">Hold for 2 seconds. Release early to cancel. One of ${Object.keys(Billi.TRIGGER_METHODS).length} activation paths.</p>
            <div class="sos-hold-btn margin-top-xs" id="sos-btn"
                 onmousedown="startHold()" onmouseup="endHold()" onmouseleave="endHold()"
                 ontouchstart="startHold(event)" ontouchend="endHold()">
              <div class="hold-fill" id="hold-fill"></div>
              <span style="z-index:1;">SOS</span>
              <span class="sos-hold-hint" style="z-index:1;">HOLD 2 SECONDS</span>
            </div>
            <button class="btn btn-outline-nav margin-top" style="font-size:0.72rem;" onclick="discreet()">🤫 Discreet activation (silent, no screen change)</button>
            <div class="text-muted margin-top-xs" style="font-size:0.68rem;">Also armed: spoken safe word · fall · crash · geofence · smart tag · accessibility shortcut · wearable gesture · acoustic distress</div>
          </div>
        </section>

        <section class="card margin-top" style="padding:1rem;">
          <div class="panel-section-title" style="font-size:0.85rem;">🧪 Test the accidental-trigger safe-fail</div>
          <p class="text-muted" style="font-size:0.72rem;">Fall, crash, geofence, and acoustic triggers are sensor-inferred, not deliberate — they open a 10-second confirmation window before your Trusted Network is told anything, instead of firing instantly like SOS. Simulate one of these ambiguous sensor events (SIMULATED hardware):</p>
          <div class="flex-row margin-top-xs" style="gap:0.4rem; flex-wrap:wrap;">
            <button class="btn btn-outline-nav" style="font-size:0.68rem;" onclick="simulatePassive('fall')">📉 Simulate fall</button>
            <button class="btn btn-outline-nav" style="font-size:0.68rem;" onclick="simulatePassive('crash')">💥 Simulate crash</button>
            <button class="btn btn-outline-nav" style="font-size:0.68rem;" onclick="simulatePassive('geofence')">📍 Simulate safe-zone exit</button>
            <button class="btn btn-outline-nav" style="font-size:0.68rem;" onclick="simulatePassive('acoustic')">🔊 Simulate acoustic distress</button>
          </div>
        </section>` : ''}

        ${showAsCalm ? `
        <section class="card margin-top" style="padding:1.1rem;">
          <div class="panel-section-title" style="font-size:0.9rem;">Status</div>
          <p style="color:#e2e8f0; font-size:0.88rem;">No active alerts. All protection layers armed and monitoring.</p>
          <p class="text-muted" style="font-size:0.72rem;">Location sharing idle · audio idle · trusted network standing by</p>
        </section>` : ''}

        <!-- REAL DEVICE CAPABILITIES (Capability Adapter Layer) -->
        <section class="card margin-top" style="padding:1.1rem; border:1px solid rgba(99,102,241,0.3);">
          <div class="flex-between">
            <span class="panel-section-title" style="font-size:0.9rem;">📡 Real device capabilities</span>
            <button class="btn btn-secondary" style="font-size:0.7rem;" onclick="enableCapabilities()">Enable on this device</button>
          </div>
          <p class="text-muted" style="font-size:0.7rem;">This device's actual GPS, motion sensors, microphone, speech, and network feed the shared incident. States below are real, not simulated.</p>
          <div class="grid grid-2 margin-top-xs" style="gap:0.4rem; font-size:0.75rem;" id="cap-grid">
            ${capRow('📍 Location', BilliAdapters.Location.status, BilliAdapters.Location.mode)}
            ${capRow('📳 Motion sensors', BilliAdapters.Motion.status, '')}
            ${capRow('🎙 Audio evidence', BilliAdapters.AudioEvidence.status, BilliAdapters.AudioEvidence.segment ? BilliAdapters.AudioEvidence.segment + ' segments sealed' : '')}
            ${capRow('🔊 Spoken output', BilliAdapters.Speech.status, BilliAdapters.Speech.lastSpoken ? '"' + BilliAdapters.Speech.lastSpoken.text + '"' : '')}
            ${capRow('📶 Network', BilliAdapters.Network.status, '')}
          </div>
        </section>`;
    }

    function capRow(label, status, note) {
      const good = ['ACQUIRED', 'ACTIVE', 'RECORDING', 'READY', 'ONLINE'].includes(status);
      const bad = ['PERMISSION_DENIED', 'FAILED', 'UNSUPPORTED', 'OFFLINE'].includes(status);
      return `<div class="ready-item" style="justify-content:space-between;">
        <span style="color:#e2e8f0;">${label}</span>
        <span style="text-align:right;"><span class="${good ? 'text-green' : bad ? 'text-red' : 'text-amber'}" style="font-weight:700;">${status}</span>
        ${note ? `<br><span class="text-muted" style="font-size:0.62rem;">${note}</span>` : ''}</span></div>`;
    }

    async function enableCapabilities() {
      BilliAdapters.Network.start();
      const active = Billi.getActiveIncident();
      if (active) {
        const r = await BilliAdapters.startIncidentCapture(S.contract);
        Billi.toast(`Capabilities engaged — GPS:${r.location ? 'on' : 'off'} motion:${r.motion ? 'on' : 'off'} audio:${r.audio ? 'on' : 'off'}`, 'ok');
      } else {
        BilliAdapters.Location.armLowPower();
        await BilliAdapters.Motion.start();
        Billi.toast('Armed low-power monitoring: single location fix + motion sensing enabled.', 'ok');
      }
      render();
    }

    /* ------- Spoken output driven by CONFIRMED shared state only -------
       Spoken-once tracking derives from the incident's own telemetry, so a
       page refresh or second device never repeats an announcement. */
    const spoken = { sent: false, delivered: false, ackBy: null };
    function alreadySpoken(active, fragment) {
      return (active.telemetry || []).some(t => t.event_type === 'SPOKEN_OUTPUT' && (t.text || '').includes(fragment));
    }
    function speakOnConfirmedState() {
      const active = Billi.getActiveIncident();
      if (!active || active.duress) return; // duress: absolute silence, no reveal
      const mode = (S.contract || {}).spokenMode || 'reassurance';
      if (mode === 'silent') return;
      if (!spoken.sent && alreadySpoken(active, 'being sent')) spoken.sent = true;
      if (!spoken.sent && alreadySpoken(active, 'protocol is active')) spoken.sent = true;
      if (!spoken.delivered && alreadySpoken(active, 'delivered')) spoken.delivered = true;
      if (!spoken.delivered && alreadySpoken(active, 'have been notified')) spoken.delivered = true;
      if (!spoken.ackBy && alreadySpoken(active, 'is responding')) {
        const priorAck = (active.actions || []).find(a => a.type === 'GUARDIAN_ACKNOWLEDGED');
        spoken.ackBy = priorAck ? priorAck.actor : 'replayed';
      }
      const v = Billi.incidentView(active);
      if (!spoken.sent && (v.core.network === 'SENT' || v.core.network === 'DELIVERED')) {
        spoken.sent = true;
        BilliAdapters.Speech.speak(mode === 'deterrent' ? 'Billi emergency protocol is active. Location and incident information are being transmitted.' : 'Billi is active. Your alert is being sent.', mode);
      }
      if (!spoken.delivered && (v.core.network === 'DELIVERED' || v.core.network === 'ACKNOWLEDGED')) {
        spoken.delivered = true;
        BilliAdapters.Speech.speak(mode === 'deterrent' ? 'Trusted contacts have been notified.' : 'Your alert was delivered to your trusted network.', mode);
      }
      const ack = (active.actions || []).find(a => a.type === 'GUARDIAN_ACKNOWLEDGED');
      if (ack && spoken.ackBy !== ack.actor) {
        spoken.ackBy = ack.actor;
        const c = (S.contacts || []).find(x => x.name === ack.actor);
        const who = c && c.relationship === 'Mother' ? 'Your mother' : c && c.relationship === 'Father' ? 'Your father' : ack.actor;
        BilliAdapters.Speech.speak(`${who} is responding.`, mode);
      }
    }
    document.addEventListener('billi:shared', () => { speakOnConfirmedState(); const a = Billi.getActiveIncident(); if (!a || !a.duress) render(); });
    document.addEventListener('billi:adapter', () => { const a = Billi.getActiveIncident(); if (!a || !a.duress) render(); });
    setInterval(speakOnConfirmedState, 3000);

    /* -------- Hold-to-activate SOS -------- */
    function startHold(e) {
      if (e) e.preventDefault();
      holdStart = Date.now();
      const fill = document.getElementById('hold-fill');
      holdTimer = setInterval(() => {
        const pct = Math.min(100, (Date.now() - holdStart) / 20);
        fill.style.height = pct + '%';
        if (pct >= 100) { clearInterval(holdTimer); holdTimer = null; fireSOS('sos_hold'); }
      }, 40);
    }
    function endHold() {
      if (holdTimer) {
        clearInterval(holdTimer); holdTimer = null;
        document.getElementById('hold-fill').style.height = '0%';
        Billi.toast('Released early — activation cancelled.', 'warn');
      }
    }
    function fireSOS(key) {
      Billi.triggerIncident(key);
      Billi.toast('Emergency activated. Billi is executing the four core actions.', 'danger');
      /* User gesture context: engage real device capture for the incident. */
      BilliAdapters.startIncidentCapture(S.contract).then(() => render());
      render(); Billi.renderNav('protected.html');
    }
    function discreet() {
      Billi.triggerIncident('accessibility');
      Billi.toast('Discreet activation received. No outward indication shown.', 'ok');
      render(); Billi.renderNav('protected.html');
    }

    /* -------- Sensor-inferred (passive) triggers — accidental-trigger safe-fail --------
       Real haptic feedback (actual Vibration API, not simulated) so a phone
       in a bag or pocket still gives the person a chance to notice and
       react during the confirmation window. */
    function simulatePassive(key) {
      Billi.triggerIncident(key);
      if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
      Billi.toast(`${Billi.TRIGGER_METHODS[key].method} detected — confirming before your Trusted Network is told.`, 'warn');
      BilliAdapters.startIncidentCapture(S.contract).then(() => render());
      render(); Billi.renderNav('protected.html');
      startConfirmTicker();
    }
    function confirmReal() {
      Billi.confirmEmergency();
      Billi.toast('Confirmed — alerting your Trusted Network now.', 'danger');
      stopConfirmTicker();
      render(); Billi.renderNav('protected.html');
    }
    function dismissFalse() {
      const res = Billi.dismissFalseAlarm();
      stopConfirmTicker();
      if (res.ok) {
        Billi.toast('✓ Dismissed as a false alarm. Your Trusted Network was never notified.', 'ok');
        setTimeout(() => location.href = 'dashboard.html', 1000);
      } else {
        /* Race: the confirmation window closed (fail-safe auto-confirm)
           between render and tap. The incident is now live — never tell the
           person it was dismissed when it wasn't. */
        Billi.toast('The confirmation window already closed — this is now a live alert to your Trusted Network. Use Cancel emergency below if it\'s truly a false alarm.', 'warn');
        render(); Billi.renderNav('protected.html');
      }
    }
    /* 1s ticker just for the confirmation countdown — the rest of the page
       renders on the existing 4s interval, too coarse for a 10s countdown. */
    let confirmTicker = null;
    function startConfirmTicker() {
      if (confirmTicker) return;
      confirmTicker = setInterval(() => {
        const a = Billi.getActiveIncident();
        if (!a || !Billi.incidentView(a).pendingConfirmation) { stopConfirmTicker(); render(); return; }
        render();
      }, 1000);
    }
    function stopConfirmTicker() {
      if (confirmTicker) { clearInterval(confirmTicker); confirmTicker = null; }
    }

    function cancelNoPin() {
      Billi.cancelWithoutPin();
      Billi.toast('✓ Marked safe. Your Trusted Network has been told you are okay.', 'ok');
      setTimeout(() => location.href = 'dashboard.html', 1000);
    }

    /* -------- PIN pad / duress branch -------- */
    function pinKey(k) {
      if (k === '⌫') pinBuffer = pinBuffer.slice(0, -1);
      else if (pinBuffer.length < 4) pinBuffer += k;
      if (pinBuffer.length === 4) {
        const res = Billi.enterDuress(pinBuffer);
        pinBuffer = '';
        if (res.mode === 'normal') {
          Billi.toast('✓ Marked safe. Your Trusted Network has been told you are okay.', 'ok');
          setTimeout(() => location.href = 'dashboard.html', 1000);
        } else if (res.mode === 'duress') {
          /* Covert: believable cancellation, no red border, no escalation hint. */
          document.getElementById('feign-screen').style.display = 'flex';
        } else {
          Billi.toast('Incorrect PIN.', 'warn');
        }
      }
      render();
    }
    function closeFeign() {
      document.getElementById('feign-screen').style.display = 'none';
      render(); Billi.renderNav('protected.html');
    }

    render();
    if (Billi.getActiveIncident() && Billi.incidentView(Billi.getActiveIncident()).pendingConfirmation) startConfirmTicker();
    setInterval(() => { const a = Billi.getActiveIncident(); if (a && !a.duress) render(); }, 4000);
  </script>
</body>
</html>
