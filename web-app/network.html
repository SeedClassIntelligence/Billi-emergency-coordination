<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILLI — Trusted Network Operations</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-root">
  <div class="dashboard-full-wrapper">
    <div id="billi-nav"></div>
    <main class="dashboard-main-container" style="max-width:940px; margin:0 auto;" id="main-host"></main>
  </div>

  <script src="billi-core.js"></script>
  <script>
    if (!Billi.requireSetup()) throw new Error('redirect');
    Billi.renderNav('network.html');
    const S = Billi.state;

    function render() {
      const sorted = [...S.contacts].sort((a, b) => a.priority - b.priority);
      document.getElementById('main-host').innerHTML = `
        <section class="margin-top">
          <div class="dash-greeting-title">Trusted Network</div>
          <div class="dash-greeting-sub">Every emergency notifies everyone below who is toggled ON, all at once — priority order only decides who leads the response and where escalation turns next if nobody acknowledges. Toggle a contact off to exclude them from alerts entirely.</div>
        </section>

        <section class="margin-top">
          ${sorted.map((c, idx) => `
            <div class="card margin-top-xs" style="padding:1rem 1.2rem; ${c.notifyEnabled === false ? 'opacity:0.55;' : ''}">
              <div class="flex-between" style="flex-wrap:wrap; gap:0.6rem;">
                <div class="flex-row" style="gap:0.85rem;">
                  <div class="avatar-initials" style="width:44px; height:44px;">${Billi.initials(c.name)}</div>
                  <div>
                    <div style="color:#fff; font-weight:700;">${c.name}
                      <span class="badge badge-indigo" style="margin-left:0.4rem;">Priority ${c.priority}</span>
                      <span class="badge ${c.availability === 'Available' ? 'badge-green' : 'badge-amber'}" style="margin-left:0.25rem;">${c.availability || 'Availability unknown'}</span>
                    </div>
                    <div class="text-muted" style="font-size:0.76rem;">${c.role} · ${c.relationship} · ${c.phone}</div>
                    <div class="flex-row margin-top-xs" style="gap:0.35rem; flex-wrap:wrap;">
                      ${(c.channels || []).map(ch => `<span class="badge badge-blue" style="font-size:0.62rem;">${ch}</span>`).join('')}
                      <span class="badge ${c.canAcknowledge ? 'badge-green' : 'badge-amber'}" style="font-size:0.62rem;">${c.canAcknowledge ? 'Can acknowledge' : 'No acknowledge'}</span>
                      <span class="badge ${c.canResolve ? 'badge-green' : 'badge-amber'}" style="font-size:0.62rem;">${c.canResolve ? 'Can resolve' : 'No resolve'}</span>
                      <span class="badge ${c.medicalAccess ? 'badge-green' : 'badge-amber'}" style="font-size:0.62rem;">${c.medicalAccess ? 'Medical access' : 'No medical'}</span>
                      <span class="badge ${c.duressVisibility ? 'badge-red' : 'badge-amber'}" style="font-size:0.62rem;">${c.duressVisibility ? 'Sees duress alerts' : 'No duress visibility'}</span>
                    </div>
                  </div>
                </div>
                <div class="flex-row" style="gap:0.35rem; align-items:center;">
                  <button class="btn ${c.notifyEnabled === false ? 'btn-outline-nav' : 'btn-primary'}" style="font-size:0.7rem;" onclick="toggleNotify('${c.id}')" title="Whether this person is alerted when an emergency is triggered">
                    ${c.notifyEnabled === false ? '🔕 Notify: OFF' : '🔔 Notify: ON'}
                  </button>
                  <button class="btn btn-outline-nav" style="font-size:0.7rem;" ${idx === 0 ? 'disabled' : ''} onclick="move('${c.id}',-1)">↑</button>
                  <button class="btn btn-outline-nav" style="font-size:0.7rem;" ${idx === sorted.length - 1 ? 'disabled' : ''} onclick="move('${c.id}',1)">↓</button>
                  <button class="btn btn-secondary" style="font-size:0.7rem;" onclick="testChannel('${c.id}')">Test channels</button>
                  <button class="btn-dash-logout" onclick="removeContact('${c.id}')">Remove</button>
                </div>
              </div>
            </div>`).join('') || '<p class="text-muted margin-top">No contacts — add your first responder below.</p>'}
        </section>

        <section class="card margin-top" style="padding:1.1rem; border:1px dashed rgba(99,102,241,0.4);">
          <strong style="color:#fff;">Add trusted contact</strong>
          <div class="grid grid-4 margin-top-xs" style="gap:0.5rem;">
            <input id="nc-name" class="form-control-dark" placeholder="Name">
            <input id="nc-rel" class="form-control-dark" placeholder="Relationship">
            <input id="nc-phone" class="form-control-dark" placeholder="Phone">
            <select id="nc-role" class="form-control-dark">
              <option>Primary Guardian</option><option>Secondary Guardian</option><option>Campus Safety</option><option>Caregiver</option><option>Extended Circle</option>
            </select>
          </div>
          <div class="flex-row margin-top-xs" style="gap:1rem; font-size:0.76rem; color:#94a3b8; flex-wrap:wrap;">
            <label><input type="checkbox" id="nc-notify" checked> Notify on emergency</label>
            <label><input type="checkbox" id="nc-ack" checked> Acknowledge</label>
            <label><input type="checkbox" id="nc-res"> Resolve</label>
            <label><input type="checkbox" id="nc-med"> Medical</label>
            <label><input type="checkbox" id="nc-dur" checked> Duress visibility</label>
          </div>
          <button class="btn btn-secondary margin-top-xs" onclick="addContact()">+ Add contact</button>
        </section>

        <section class="card margin-top" style="padding:1rem;">
          <div class="panel-section-title" style="font-size:0.92rem;">Notification & escalation preview</div>
          <div class="text-muted margin-top-xs" style="font-size:0.8rem;">
            <strong style="color:#e2e8f0;">Notified immediately, all at once:</strong>
            ${sorted.filter(c => c.notifyEnabled !== false).map(c => c.name).join(', ') || 'nobody — every contact is toggled off'}
            ${sorted.some(c => c.notifyEnabled === false) ? `<br><strong style="color:#64748b;">Excluded (toggled off):</strong> ${sorted.filter(c => c.notifyEnabled === false).map(c => c.name).join(', ')}` : ''}
            <br><br><strong style="color:#e2e8f0;">If nobody acknowledges, response urgency escalates:</strong>
            ${sorted.map(c => `T+${(c.priority - 1) * 15}s → ${c.name} (${(c.channels || ['Push']).join('/')})`).join('  ·  ') || '—'}
            <br><span style="font-size:0.72rem;">45-second guardian window · final stage: emergency-services escalation</span>
          </div>
        </section>`;
    }

    function move(id, dir) {
      const sorted = [...S.contacts].sort((a, b) => a.priority - b.priority);
      const i = sorted.findIndex(c => c.id === id);
      const j = i + dir;
      if (j < 0 || j >= sorted.length) return;
      const a = sorted[i], b = sorted[j];
      const t = a.priority; a.priority = b.priority; b.priority = t;
      Billi.save(); render();
      Billi.audit((S.owner || {}).name || 'Owner', 'NETWORK_REORDERED', `${a.name} moved to priority ${a.priority}.`);
    }

    function toggleNotify(id) {
      const c = S.contacts.find(x => x.id === id);
      c.notifyEnabled = c.notifyEnabled === false ? true : false;
      Billi.save(); render();
      Billi.audit((S.owner || {}).name || 'Owner', 'CONTACT_NOTIFY_TOGGLED', `${c.name} ${c.notifyEnabled ? 'will now be notified' : 'will NOT be notified'} on emergency activation.`);
      Billi.toast(c.notifyEnabled ? `🔔 ${c.name} will be notified in an emergency.` : `🔕 ${c.name} will NOT be notified in an emergency.`, c.notifyEnabled ? 'ok' : 'warn');
    }

    function removeContact(id) {
      const c = S.contacts.find(x => x.id === id);
      if (!confirm(`Remove ${c.name} from the Trusted Network?`)) return;
      S.contacts = S.contacts.filter(x => x.id !== id);
      Billi.save(); render();
      Billi.audit((S.owner || {}).name || 'Owner', 'CONTACT_REMOVED', `${c.name} removed from Trusted Network.`);
    }

    function testChannel(id) {
      const c = S.contacts.find(x => x.id === id);
      Billi.toast(`Channel test → ${c.name}: ${(c.channels || []).join(', ')} — delivery OK.`, 'ok');
      Billi.audit('System', 'CHANNEL_TEST', `Notification channel test for ${c.name}.`);
    }

    function addContact() {
      const name = document.getElementById('nc-name').value.trim();
      if (!name) { Billi.toast('Enter a name.', 'warn'); return; }
      const maxP = Math.max(0, ...S.contacts.map(c => c.priority));
      S.contacts.push({
        id: Billi.uid('c'), name,
        relationship: document.getElementById('nc-rel').value.trim(),
        role: document.getElementById('nc-role').value,
        priority: maxP + 1, phone: document.getElementById('nc-phone').value.trim(),
        channels: ['Push', 'SMS'],
        notifyEnabled: document.getElementById('nc-notify').checked,
        canAcknowledge: document.getElementById('nc-ack').checked,
        canResolve: document.getElementById('nc-res').checked,
        medicalAccess: document.getElementById('nc-med').checked,
        evidenceAccess: false, locationAccess: true,
        duressVisibility: document.getElementById('nc-dur').checked, availability: 'Available'
      });
      Billi.save(); render();
      Billi.audit((S.owner || {}).name || 'Owner', 'CONTACT_ADDED', `${name} added at priority ${maxP + 1}.`);
      Billi.toast(`✓ ${name} added.`, 'ok');
    }

    render();
  </script>
</body>
</html>
