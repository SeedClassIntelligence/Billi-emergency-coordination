<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BILLI — Build Your Safety Ecosystem</title>
  <link rel="stylesheet" href="style.css">
  <!-- Leaflet + OpenStreetMap: the one external dependency in this app,
       used only for the Safe Zones map. Free, no API key, no billing
       account — chosen specifically to avoid adding a paid/keyed service
       like Google Maps. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Address/building search box on the map — uses OpenStreetMap's free
       Nominatim geocoding service under the hood, same no-API-key,
       no-billing-account choice as the map tiles themselves. -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.css" />
  <script src="https://unpkg.com/leaflet-control-geocoder@2.4.0/dist/Control.Geocoder.js"></script>
</head>
<body class="bg-root">

  <div class="onboarding-full-wrapper">
    <header class="onboarding-top-bar flex-between">
      <div class="brand-mark" onclick="location.href='landing.html'" style="cursor:pointer;">BILLI</div>
      <div class="flex-row" style="gap:0.75rem; align-items:center;">
        <span class="sim-chip local">Setup saves locally · refresh-safe · resumable</span>
        <button class="btn-dash-logout" onclick="Billi.logout()">Exit Setup</button>
      </div>
    </header>

    <main class="dashboard-main-container" style="max-width: 880px; margin: 0 auto;">

      <section class="text-center margin-top">
        <h1 class="onboarding-hero-title">Welcome to Billi</h1>
        <p class="onboarding-hero-sub">Set this up once, now, while nothing is wrong. Who comes for you, in what order, and what Billi is allowed to do — all decided here, so none of it has to be decided during an emergency.</p>
        <div class="flex-row justify-center margin-top-xs" style="gap:0.5rem; flex-wrap:wrap;">
          <button class="btn btn-outline-nav" style="font-size:0.72rem;" onclick="prefillDemo()">⚡ Fill everything (Maya Johnson fixture)</button>
          <button class="btn btn-outline-nav" style="font-size:0.72rem;" onclick="skipToActivation()">⏭ Skip to activation</button>
        </div>
      </section>

      <!-- PROGRESS -->
      <section class="setup-progress-box margin-top-md">
        <div class="flex-between">
          <span class="progress-title-text" id="prog-text">Step 1 of 10</span>
          <span class="pill-badge-blue" id="prog-badge">0% Complete</span>
        </div>
        <div class="progress-track-bg margin-top-xs">
          <div class="progress-fill-indigo" id="prog-bar" style="width:11%;"></div>
        </div>
        <!-- Jump straight to any step. Built for narrating a walkthrough on a
             clock: with the fixture loaded every step already has content, so
             1 -> 5 -> 6 -> 10 is three clicks instead of nine. -->
        <div class="step-jump" id="step-jump"></div>
      </section>

      <!-- STEP PANES -->
      <section class="onboarding-main-card margin-top-md" id="step-host"></section>

      <!-- NAV BUTTONS -->
      <div class="onboarding-bottom-buttons flex-between margin-top">
        <button class="btn-pill-back" id="btn-back" onclick="goStep(cur-1)">← Back</button>
        <button class="btn-pill-next" id="btn-next" onclick="nextStep()">Next →</button>
      </div>

    </main>
  </div>

  <script src="billi-core.js"></script>
  <script>
    if (!Billi.state.session.authed) location.href = 'auth.html';
    if (Billi.state.setup.complete) location.href = 'dashboard.html';
    Billi.mountFeedback();

    const S = Billi.state;
    let cur = S.setup.step || 1;
    const GW = (location.protocol === 'https:') ? '' : 'http://localhost:8080';
    let setupReview = null, setupReviewFetchedFor = null, setupReviewLoading = false;

    /* Extends Gemini beyond incident-time into the SETUP phase — reviews the
       current Safety Contract/readiness config for prioritized, plain-language
       gaps grounded in what's actually configured, not a restated checklist. */
    function refreshSetupReview() {
      const items = Billi.readiness();
      const key = JSON.stringify(items.map(i => i.ok));
      if (setupReviewFetchedFor === key || setupReviewLoading) return;
      setupReviewLoading = true;
      setupReviewFetchedFor = key;
      fetch(`${GW}/api/v1/context/review-setup`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          readiness: items, contract: S.contract, protectedPerson: S.protectedPerson,
          contactCount: S.contacts.length, hasNormalPin: !!(S.pins && S.pins.normal),
          hasDuressPin: !!(S.pins && S.pins.duress), voiceEnrolled: S.voice && S.voice.state === 'Enrolled',
          zoneCount: S.zones.length, deviceCount: S.devices.length
        })
      }).then(r => r.ok ? r.json() : null).then(data => {
        setupReviewLoading = false;
        if (!data) return;
        setupReview = data;
        if (cur === TOTAL_STEPS) render();
      }).catch(() => { setupReviewLoading = false; });
    }

    const TOTAL_STEPS = 10;
    /* Written as what the step does for you, not what the data model calls
       it. "Choose the Entity" and "Protected Person" are our words, not the
       words of someone setting this up before a night shift. */
    const STEP_TITLES = ['Who Billi Protects', 'Your Details', 'Who Is Out There', 'Medical Information',
      'Who Comes For You', 'What Billi May Do', 'Safe Word & Duress PIN', 'Your Places', 'Your Devices',
      'Review & Start Protecting'];

    /* Lone worker first. A sole proprietor protecting themselves had no
       option here at all: "Business" read as an employer protecting staff,
       and "Family" led the list, so the person Billi is actually built for
       saw six choices and fit none of them. */
    const ENTITIES = [
      ['Just me', 'I work alone — protect me while I am out there'],
      ['Me and my family', 'One account covers my work and the people at home'],
      ['My team', 'A small crew or a few drivers I am responsible for'],
      ['My family', 'Protect a child, a parent, or someone at home'],
      ['School / Campus', 'Students and staff'],
      ['Healthcare / Community', 'Patients, caregivers, or a neighbourhood']
    ];

    const DEVICE_CATALOG = [
      ['iPhone 15 Pro', 'Phone (Primary Hub)', 'SIMULATED'], ['Apple Watch Ultra 2', 'Watch', 'SIMULATED'],
      ['Garmin Fenix 7 Pro', 'Watch', 'REGISTERED'], ['Samsung Galaxy Ring', 'Ring', 'STANDBY'],
      ['Pixel Watch 3 LTE', 'Watch', 'OFFLINE'], ['Ray-Ban Meta Glasses', 'Glasses', 'SIMULATED'],
      ['Sennheiser Accentum', 'Headphones', 'STANDBY'], ['Billi Smart Tag', 'Smart Tag', 'SIMULATED'],
      ['Family Vehicle Unit', 'Vehicle', 'FUTURE ADAPTER']
    ];

    function esc(s) { return (s || '').toString().replace(/</g, '&lt;'); }
    function field(id, label, val, ph, type) {
      return `<div class="form-group margin-top-xs"><label class="form-label-muted">${label}</label>
        <input id="${id}" type="${type || 'text'}" class="form-control-dark" placeholder="${ph || ''}" value="${esc(val)}"></div>`;
    }
    function stateChip(st) {
      const cls = { SIMULATED: 'simulated', CONNECTED: 'connected', 'FUTURE ADAPTER': 'future', OFFLINE: 'unavail', UNAVAILABLE: 'unavail' }[st] || 'local';
      return `<span class="sim-chip ${cls}">${st}</span>`;
    }

    /* ---------- STEP RENDERERS ---------- */
    function render() {
      document.getElementById('prog-text').innerText = `Step ${cur} of ${TOTAL_STEPS} — ${STEP_TITLES[cur - 1]}`;
      document.getElementById('prog-badge').innerText = `${Math.round(((cur - 1) / TOTAL_STEPS) * 100)}% Complete`;
      document.getElementById('prog-bar').style.width = `${Math.round((cur / TOTAL_STEPS) * 100)}%`;
      document.getElementById('btn-back').style.visibility = cur === 1 ? 'hidden' : 'visible';
      document.getElementById('btn-next').innerText = cur === TOTAL_STEPS ? '✓ ACTIVATE BILLI' : `Next: ${STEP_TITLES[cur] || ''} →`;
      document.getElementById('step-jump').innerHTML = STEP_TITLES.map((t, i) => `
        <button class="step-jump-chip ${i + 1 === cur ? 'current' : ''}" onclick="goStep(${i + 1})" title="${t}">
          <span class="step-jump-num">${i + 1}</span><span class="step-jump-label">${t}</span>
        </button>`).join('');
      document.getElementById('step-host').innerHTML = STEPS[cur - 1]();
      if (cur === 8) initZoneMap();
      if (cur === TOTAL_STEPS) refreshSetupReview();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    const STEPS = [
      /* 1 — Entity */
      () => `
        <h2 class="panel-section-title">Who is Billi protecting?</h2>
        <p class="text-muted" style="font-size:0.85rem;">Most people here are protecting themselves while they work alone. Pick the closest — you can change it later, and it only shapes how your command centre is labelled.</p>
        <div class="grid grid-2 margin-top" style="gap:0.6rem;">
          ${ENTITIES.map(([name, desc]) => `
            <div class="card" style="cursor:pointer; padding:1rem; border:1px solid ${S.entityType === name ? 'rgba(99,102,241,0.7)' : 'rgba(255,255,255,0.08)'}; background:${S.entityType === name ? 'rgba(99,102,241,0.12)' : ''};"
                 onclick="S.entityType='${name}'; Billi.save(); render();">
              <strong style="color:#fff;">${name}</strong>
              <div class="text-muted" style="font-size:0.76rem; margin-top:0.2rem;">${desc}</div>
            </div>`).join('')}
        </div>`,

      /* 2 — Owner */
      () => {
        const o = S.owner || {};
        return `
        <h2 class="panel-section-title">Who runs this account?</h2>
        <p class="text-muted" style="font-size:0.85rem;">Usually you. If you are protecting yourself, this is also the person your alerts are sent <em>about</em> — and the first person your Trusted Network will hear from.</p>
        ${field('own-name', 'Full name', o.name, 'Evelyn Johnson')}
        <div class="grid grid-2" style="gap:0.75rem;">
          ${field('own-role', 'Role', o.role, 'Primary Guardian')}
          ${field('own-rel', 'Relationship to protected person', o.relationship, 'Mother')}
        </div>
        ${field('own-phone', 'Phone', o.phone, '+1 (555) 987-6543', 'tel')}`;
      },

      /* 3 — Protected person */
      () => {
        const p = S.protectedPerson || {};
        return `
        <h2 class="panel-section-title">Who is out there alone?</h2>
        <p class="text-muted" style="font-size:0.85rem;">If that is you, put your own name here. Billi is built around one person — every device, contact and rule exists to serve them. You can add a second person to this account later.</p>
        ${field('pp-name', 'Full name', p.name, 'Maya Johnson')}
        <div class="grid grid-2" style="gap:0.75rem;">
          ${field('pp-age', 'Age', p.age, '11', 'number')}
          ${field('pp-fac', 'School / workplace / facility', p.facility, 'Pine Middle School')}
        </div>`;
      },

      /* 4 — Medical */
      () => {
        const m = S.medical || {};
        return `
        <h2 class="panel-section-title">Medical & emergency dossier</h2>
        <p class="text-muted" style="font-size:0.85rem;">What someone who has never met you would need to know. Shared only with the contacts you authorise, and only during an emergency.</p>
        <div class="grid grid-2" style="gap:0.75rem;">
          ${field('md-cond', 'Medical conditions', m.conditions, 'Mild asthma')}
          ${field('md-alrg', 'Allergies', m.allergies, 'Peanuts')}
        </div>
        <div class="grid grid-2" style="gap:0.75rem;">
          ${field('md-meds', 'Medications & location', m.medications, 'Albuterol rescue inhaler (in backpack)')}
          ${field('md-phys', 'Physician / care contact', m.physician, 'Dr. Patel — Bayview Pediatrics')}
        </div>
        <div class="form-group margin-top-xs"><label class="form-label-muted">Emergency instructions for responders</label>
          <textarea id="md-instr" class="form-control-dark" rows="3" placeholder="e.g. Nitro spray in the centre console. Cab is locked — spare key in the rear wheel well.">${esc(m.instructions)}</textarea></div>`;
      },

      /* 5 — Trusted network */
      () => `
        <h2 class="panel-section-title">Who actually comes for you?</h2>
        <p class="text-muted" style="font-size:0.85rem;">A dispatcher, a partner, a neighbour with a key — whoever would genuinely drop what they are doing. Everyone is alerted at once; the order only decides who leads if nobody answers.</p>
        <div id="tn-list" class="margin-top-xs">
          ${S.contacts.sort((a,b)=>a.priority-b.priority).map(c => `
            <div class="card flex-between margin-top-xs" style="padding:0.75rem 1rem;">
              <div class="flex-row" style="gap:0.7rem;">
                <div class="avatar-initials">${Billi.initials(c.name)}</div>
                <div>
                  <strong style="color:#fff;">${esc(c.name)}</strong>
                  <div class="text-muted" style="font-size:0.75rem;">${esc(c.role)} · ${esc(c.relationship)} · ${esc(c.phone)} · ${(c.channels||[]).join(' / ')}</div>
                  <div class="text-muted" style="font-size:0.7rem;">${c.notifyEnabled === false ? '🔕 Not notified' : '🔔 Notified on emergency'} · ${c.canAcknowledge ? '✓ Acknowledge' : '— No acknowledge'} · ${c.canResolve ? '✓ Resolve' : '— No resolve'} · ${c.medicalAccess ? '✓ Medical' : '— No medical'} · ${c.duressVisibility ? '✓ Duress alerts' : '— No duress'}</div>
                </div>
              </div>
              <div class="flex-row" style="gap:0.4rem; align-items:center;">
                <span class="badge badge-indigo">Priority ${c.priority}</span>
                <button class="btn-dash-logout" onclick="S.contacts=S.contacts.filter(x=>x.id!=='${c.id}');Billi.save();render();">✕</button>
              </div>
            </div>`).join('') || '<p class="text-muted" style="font-size:0.82rem;">No one added yet — add at least one. Two is better, in case the first is driving.</p>'}
        </div>
        <div class="card margin-top" style="padding:1rem; border:1px dashed rgba(99,102,241,0.4);">
          <strong style="color:#fff; font-size:0.9rem;">Add contact</strong>
          <div class="grid grid-2" style="gap:0.6rem;">
            ${field('tn-name', 'Name', '', 'Marcus Johnson')}
            ${field('tn-rel', 'Relationship', '', 'Father')}
          </div>
          <div class="grid grid-3" style="gap:0.6rem;">
            ${field('tn-phone', 'Phone', '', '+1 (555) ...', 'tel')}
            <div class="form-group margin-top-xs"><label class="form-label-muted">Role</label>
              <select id="tn-role" class="form-control-dark">
                <option>Primary Guardian</option><option>Secondary Guardian</option><option>Campus Safety</option><option>Caregiver</option><option>Extended Circle</option>
              </select></div>
            <div class="form-group margin-top-xs"><label class="form-label-muted">Priority</label>
              <select id="tn-prio" class="form-control-dark"><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
          </div>
          <div class="flex-row margin-top-xs" style="gap:1rem; font-size:0.78rem; color:#94a3b8; flex-wrap:wrap;">
            <label><input type="checkbox" id="tn-notify" checked> Notify on emergency</label>
            <label><input type="checkbox" id="tn-ack" checked> Acknowledgment rights</label>
            <label><input type="checkbox" id="tn-res"> Resolution rights</label>
            <label><input type="checkbox" id="tn-med"> Medical access</label>
            <label><input type="checkbox" id="tn-dur" checked> Duress visibility</label>
          </div>
          <p class="text-muted" style="font-size:0.7rem; margin-top:0.3rem;">By default, everyone in the Trusted Network is notified the instant an emergency is triggered — priority order only decides who leads the response if nobody acknowledges. Uncheck "Notify on emergency" to keep someone in the network without alerting them.</p>
          <button class="btn btn-secondary margin-top-xs" onclick="addContact()">+ Add to Trusted Network</button>
        </div>`,

      /* 6 — Safety contract */
      () => {
        if (!S.contract) { S.contract = { gps:true, audio:true, video:false, notifyNetwork:true, silentActivation:true, spokenMode:'reassurance', spokenLanguage:'en', deterrent:false, shareMedical:true, escalation:true, nearbyRelay:false, bleScanning:true, safeZoneMonitoring:true, wearables:true, evidenceRetention:true, aiProcessing:true, responderAccess:true }; Billi.save(); }
        const c = S.contract;
        const tog = (key, label, desc) => `
          <div class="card flex-between margin-top-xs" style="padding:0.7rem 1rem;">
            <div><strong style="color:#fff; font-size:0.88rem;">${label}</strong><div class="text-muted" style="font-size:0.72rem;">${desc}</div></div>
            <button class="btn ${c[key] ? 'btn-primary' : 'btn-outline-nav'}" style="min-width:96px;" onclick="S.contract['${key}']=!S.contract['${key}'];Billi.save();render();">${c[key] ? 'AUTHORIZED' : 'OFF'}</button>
          </div>`;
        return `
        <h2 class="panel-section-title">Configure the Safety Contract</h2>
        <p class="text-muted" style="font-size:0.85rem;">The Safety Contract defines exactly what Billi may do during an emergency. No permission dialogs at emergency time — every decision is made here, now.</p>
        ${tog('gps', 'High-accuracy GPS & continuous location', 'Location, speed, heading, movement history during incidents')}
        ${tog('audio', 'Audio recording', 'Ambient audio evidence from authorized devices')}
        ${tog('video', 'Photo evidence', 'Periodic camera snapshots during an incident — real capture, not continuous video')}
        ${tog('notifyNetwork', 'Trusted-Network notification', 'Alert your contacts by priority when Billi activates')}
        ${tog('silentActivation', 'Silent activation', 'Triggers make no sound or screen change visible to an aggressor')}
        ${tog('shareMedical', 'Medical-information sharing', 'Dossier shared with authorized responders during incidents')}
        ${tog('escalation', 'Progressive escalation', '45-second guardian window, then staged escalation ladder')}
        ${tog('nearbyRelay', 'Nearby-relay participation', 'BLE relay strategy when cellular fails')}
        ${tog('bleScanning', 'BLE device scanning', 'Discover and bind protection hardware')}
        ${tog('aiProcessing', 'AI processing (Gemini)', 'AI-assisted summaries — assists, never decides')}
        <div class="card margin-top-xs" style="padding:0.7rem 1rem;">
          <strong style="color:#fff; font-size:0.88rem;">Spoken response mode</strong>
          <div class="flex-row margin-top-xs" style="gap:0.5rem;">
            ${['reassurance','deterrent','silent'].map(m => `<button class="btn ${c.spokenMode===m?'btn-primary':'btn-outline-nav'}" onclick="S.contract.spokenMode='${m}';Billi.save();render();">${m.charAt(0).toUpperCase()+m.slice(1)}</button>`).join('')}
          </div>
          <div class="text-muted" style="font-size:0.72rem; margin-top:0.4rem;">Reassurance: "Your mother received your alert." · Deterrent: "Billi emergency protocol is active." · Silent: no outward audio.</div>
          <strong style="color:#fff; font-size:0.88rem; display:block; margin-top:0.7rem;">Spoken language (Gemini-translated)</strong>
          <select class="form-control-dark margin-top-xs" onchange="S.contract.spokenLanguage=this.value;Billi.save();">
            ${[['en','English'],['es','Español'],['fr','Français'],['zh','中文'],['ar','العربية'],['hi','हिन्दी'],['pt','Português'],['vi','Tiếng Việt'],['tl','Tagalog']].map(([code,name]) =>
              `<option value="${code}" ${(c.spokenLanguage||'en')===code?'selected':''}>${name}</option>`).join('')}
          </select>
          <div class="text-muted" style="font-size:0.72rem; margin-top:0.3rem;">Billi's spoken reassurance is live-translated by Gemini before speaking, for a protected person or guardian who doesn't speak English.</div>
        </div>`;
      },

      /* 7 — Voice & coercion */
      () => {
        const v = S.voice, p = S.pins;
        return `
        <h2 class="panel-section-title">Voice & coercion protection</h2>
        <div class="card margin-top-xs" style="padding:1rem;">
          <div class="flex-between">
            <strong style="color:#fff;">Spoken safe words</strong>
            <span class="text-muted" style="font-size:0.72rem;">Masked after saving · reveal deliberately</span>
          </div>
          <div id="sw-list" class="flex-row margin-top-xs" style="gap:0.5rem; flex-wrap:wrap;">
            ${v.safeWords.map((w, i) => `<span class="badge badge-indigo" style="font-size:0.78rem;">
              <span id="sw-${i}">••••••••</span>
              <a style="cursor:pointer; margin-left:0.4rem;" onclick="document.getElementById('sw-${i}').innerText='${esc(w)}'">👁</a>
              <a style="cursor:pointer; margin-left:0.3rem;" onclick="S.voice.safeWords.splice(${i},1);Billi.save();render();">✕</a></span>`).join('') || '<span class="text-muted" style="font-size:0.8rem;">None enrolled</span>'}
          </div>
          <div class="flex-row margin-top-xs" style="gap:0.5rem;">
            <input id="sw-new" class="form-control-dark" placeholder='e.g. "Blue Folder"' style="flex:1;">
            <button class="btn btn-secondary" onclick="const w=document.getElementById('sw-new').value.trim(); if(w){S.voice.safeWords.push(w);Billi.save();render();}">+ Add</button>
          </div>
        </div>

        <div class="card margin-top-xs" style="padding:1rem;">
          <div class="flex-between">
            <strong style="color:#fff;">Record your safe word</strong>
            <span class="voice-state-chip ${v.state === 'Enrolled' ? 'badge-green badge' : v.state === 'Recording…' ? 'badge badge-red' : 'badge badge-amber'}">${v.state}</span>
          </div>
          <p class="text-muted margin-top-xs" style="font-size:0.78rem;">
            Say your safe word out loud so your guardians know how it sounds when you say it. Your
            browser will ask for microphone permission — that is a real recording, and you can play it
            back below.
          </p>
          <div class="flex-row margin-top-xs" style="gap:0.5rem; flex-wrap:wrap;">
            <button class="btn ${v.state === 'Recording…' ? 'btn-danger' : 'btn-secondary'}" id="voice-btn" onclick="calibrateVoice()">
              ${v.state === 'Recording…' ? '⏹ Stop recording' : v.state === 'Enrolled' ? '↻ Record again' : '🎙 Start recording'}
            </button>
            ${v.state === 'Enrolled' ? '<button class="btn btn-outline-nav" onclick="playVoiceback()">▶ Play it back</button>' : ''}
          </div>
          ${v.state === 'Enrolled' && v.bytes ? `
          <p class="text-muted margin-top-xs" style="font-size:0.72rem;">
            ${(v.bytes / 1024).toFixed(1)} KB captured${v.recordedAt ? ' · ' + new Date(v.recordedAt).toLocaleString() : ''}.
            Playback works in this session; the audio is not uploaded anywhere.
          </p>` : ''}
          <p class="text-muted margin-top-xs" style="font-size:0.7rem;">
            Billi saves what you said so a guardian can hear it. It does not build a biometric
            voiceprint — recognising a speaker automatically is not something Billi does yet.
          </p>
        </div>

        <div class="card margin-top-xs" style="padding:1rem; border:1px solid rgba(245,158,11,0.3);">
          <strong style="color:#fff;">Cancellation PINs</strong>
          <p class="text-muted" style="font-size:0.75rem;">⚠ Never reuse your phone-lock PIN. The duress PIN must differ from the normal PIN — entering it feigns cancellation while silently escalating.</p>
          <div class="grid grid-2" style="gap:0.75rem;">
            ${field('pin-norm', 'Normal cancellation PIN', p.normal, '1234', 'password')}
            ${field('pin-dur', 'Duress PIN (coercion defense)', p.duress, '9999', 'password')}
          </div>
          <div id="pin-warn" class="text-red" style="font-size:0.75rem;"></div>
        </div>`;
      },

      /* 8 — Safe zones. Locations only. Hardware used to be stapled to the
         bottom of this step, which buried the one place you register a
         device underneath a map you were using for something else. */
      () => `
        <h2 class="panel-section-title">Where should Billi know you are?</h2>
        <p class="text-muted" style="font-size:0.85rem;">Type an address or a building name — a job site, a depot, home, a client's address. Add as many as you need. If you leave one unexpectedly, your Trusted Network can be told.</p>

        <div class="card margin-top-xs" style="padding:1rem;">
          <label class="form-label-muted">Type an address, a business, or a city</label>
          <div class="flex-row margin-top-xs" style="gap:0.5rem;">
            <input id="zn-search" class="form-control-dark" style="flex:1;" placeholder="e.g. 3200 Las Vegas Blvd S, Las Vegas"
                   onkeydown="if(event.key==='Enter'){event.preventDefault();findAddress();}">
            <button id="zn-find-btn" class="btn btn-secondary" onclick="findAddress()">Find it</button>
          </div>
          <div id="zone-map" style="height:320px; border-radius:12px; overflow:hidden; margin-top:0.5rem; background:rgba(255,255,255,0.03);"></div>
          <div class="flex-row margin-top-xs" style="gap:0.5rem;">
            <button class="btn btn-outline-nav" style="font-size:0.75rem;" onclick="useCurrentLocationForZone()">📍 Use where I am now</button>
            <span id="zn-pending-label" class="text-muted" style="font-size:0.78rem; align-self:center;"></span>
          </div>
          <div class="grid grid-2 margin-top-xs" style="gap:0.6rem;">
            ${field('zn-addr', 'Address', '', 'Filled in when you search')}
            ${field('zn-name', 'Call it something (optional)', '', 'e.g. Depot')}
          </div>
          <div class="form-group margin-top-xs">
            <label class="form-label-muted">How large an area? <strong id="zn-radius-val" style="color:#a5b4fc;">100 m</strong></label>
            <input id="zn-radius" type="range" min="50" max="1000" step="10" value="100" style="width:100%;" oninput="onZoneRadiusInput(this.value)">
          </div>
          <button id="zn-add-btn" class="btn btn-secondary" onclick="addZone()">+ Save this place</button>
        </div>

        <div class="card margin-top-xs" style="padding:1rem;">
          <strong style="color:#fff;">Your places ${S.zones.length ? `<span class="badge badge-blue" style="margin-left:0.3rem;">${S.zones.length}</span>` : ''}</strong>
          <div class="margin-top-xs">
            ${S.zones.map(z => `
              <div class="flex-between margin-top-xs" style="font-size:0.85rem; padding:0.6rem 0.8rem; background:rgba(255,255,255,0.03); border-radius:8px;">
                <span style="color:#e2e8f0;">📍 ${esc(z.name)}${z.address ? `<span class="text-muted" style="font-size:0.75rem;"> · ${esc(z.address)}</span>` : ''}</span>
                <span class="flex-row" style="gap:0.5rem; align-items:center;">
                  <span class="badge badge-blue">${z.radius} m</span>
                  <a style="cursor:pointer; color:#64748b;" onclick="S.zones=S.zones.filter(x=>x.id!=='${z.id}');Billi.save();render();">✕</a>
                </span>
              </div>`).join('') || '<p class="text-muted margin-top-xs" style="font-size:0.85rem;">No places saved yet. Search for one above — this step is optional and you can add places any time.</p>'}
          </div>
        </div>`,

      /* 9 — Protection hardware, its own step. The catalog here only ever
         added fixture devices, so there was no way to register the phone you
         are actually holding. detectThisDevice() reads the real browser and
         reports what it can genuinely do, rather than assuming. */
      () => {
        const dev = detectThisDevice();
        const already = S.devices.some(x => x.thisDevice);
        return `
        <h2 class="panel-section-title">What is Billi running on?</h2>
        <p class="text-muted" style="font-size:0.85rem;">Start with the device you carry. Billi uses its real sensors — everything below was detected from this browser just now, not assumed.</p>

        <div class="card margin-top-xs" style="padding:1rem; border:1px solid rgba(99,102,241,${already ? '0.25' : '0.55'});">
          <div class="flex-between" style="flex-wrap:wrap; gap:0.5rem;">
            <div>
              <strong style="color:#fff;">${dev.icon} ${esc(dev.name)}</strong>
              <div class="text-muted" style="font-size:0.76rem;">${esc(dev.type)} · this device</div>
            </div>
            ${already
              ? '<span class="badge badge-green">✓ Registered</span>'
              : '<button class="btn btn-primary" onclick="registerThisDevice()">+ Register this device</button>'}
          </div>
          <div class="text-muted margin-top-xs" style="font-size:0.7rem; text-transform:uppercase; letter-spacing:0.05em;">Detected on this device</div>
          <div class="flex-row margin-top-xs" style="gap:0.4rem; flex-wrap:wrap;">
            ${dev.capabilities.map(c => `<span class="badge ${c.ok ? 'badge-green' : 'badge-slate'}" style="font-size:0.72rem;">${c.ok ? '✓' : '✕'} ${c.label}</span>`).join('')}
          </div>
          ${!dev.secure ? '<p style="font-size:0.72rem; color:#fbbf24; margin-top:0.5rem;">⚠ This page is not on HTTPS, so the browser blocks location, microphone and camera. They work on the live site and in the phone app.</p>' : ''}
        </div>

        <div class="card margin-top-xs" style="padding:1rem;">
          <strong style="color:#fff;">Add a phone you are not holding</strong>
          <p class="text-muted margin-top-xs" style="font-size:0.78rem;">
            Setting this up on a computer? Your phone is the device that matters, and Billi can only use its
            real GPS, microphone and camera if Billi is <em>open on that phone</em>. Nothing you type here can
            change that — a serial or IMEI number would list the phone without connecting it to anything.
          </p>
          <p class="text-muted margin-top-xs" style="font-size:0.78rem;">
            <strong style="color:#e2e8f0;">The way that actually works:</strong> open this page on the phone
            and tap "Register this device". Or add it below so it is on your list now, and connect it later.
          </p>
          <div class="grid grid-2 margin-top-xs" style="gap:0.6rem;">
            <div class="form-group"><label class="form-label-muted">What is it?</label>
              <input id="dv-name" class="form-control-dark" placeholder="e.g. My Galaxy S24"></div>
            <div class="form-group"><label class="form-label-muted">Kind</label>
              <select id="dv-type" class="form-control-dark">
                <option>Phone (Primary Hub)</option>
                <option>Watch</option>
                <option>Smart Tag</option>
                <option>Glasses</option>
                <option>Headphones</option>
                <option>Vehicle</option>
                <option>Other</option>
              </select></div>
          </div>
          <button class="btn btn-secondary" onclick="addNamedDevice()">+ Add it to my list</button>
        </div>

        <div class="card margin-top-xs" style="padding:1rem;">
          <strong style="color:#fff;">Registered ${S.devices.length ? `<span class="badge badge-blue" style="margin-left:0.3rem;">${S.devices.length}</span>` : ''}</strong>
          <div id="dev-list" class="margin-top-xs">
          ${S.devices.map(x => `
            <div class="flex-between margin-top-xs" style="font-size:0.85rem; padding:0.6rem 0.8rem; background:rgba(255,255,255,0.03); border-radius:8px;">
              <span style="color:#e2e8f0;">${esc(x.name)} <span class="text-muted" style="font-size:0.75rem;">${esc(x.type)}${x.thisDevice ? ' · this device' : ''}</span></span>
              <span class="flex-row" style="gap:0.5rem; align-items:center;">${stateChip(x.state)}
                <a style="cursor:pointer; color:#64748b;" onclick="S.devices=S.devices.filter(y=>y.id!=='${x.id}');Billi.save();render();">✕</a></span>
            </div>`).join('') || '<p class="text-muted" style="font-size:0.85rem;">Nothing registered yet — register the device you are holding above.</p>'}
          </div>
        </div>`;
      },

      /* 10 — Readiness & activate.
         Only the four REQUIRED items block activation — enough for Billi to
         function at all (a protected person, someone to notify, an
         authorized contract, GPS+network permission). Voice enrollment,
         duress PIN, safe zones, and devices are presented clearly here but
         never lock a family out of arming basic protection today — they
         stay one click away from Safety Contract / Network / Devices for
         whenever there's five quiet minutes to finish them. */
      () => {
        const items = Billi.readiness();
        const required = items.filter(i => i.required);
        const recommended = items.filter(i => !i.required);
        const requiredOk = required.every(i => i.ok);
        const recommendedOpen = recommended.filter(i => !i.ok);
        const row = (i) => `<div class="ready-item">${i.ok ? '<span class="mark-ok">✓</span>' : '<span class="mark-no">○</span>'} <span style="color:${i.ok ? '#e2e8f0' : '#64748b'};">${i.label}</span></div>`;
        return `
        <h2 class="panel-section-title">Test readiness & activate</h2>
        <p class="text-muted" style="font-size:0.85rem;">Billi checks the essentials before it starts protecting you. Everything else is optional now and can be added any time from Settings.</p>

        <div class="text-muted margin-top" style="font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;">Required to arm Billi</div>
        <div class="grid grid-fit margin-top-xs" style="gap:0.5rem;">${required.map(row).join('')}</div>

        <div class="text-muted margin-top" style="font-size:0.68rem; text-transform:uppercase; letter-spacing:0.04em; font-weight:700;">Recommended — optional, add anytime from Settings</div>
        <div class="grid grid-fit margin-top-xs" style="gap:0.5rem;">${recommended.map(row).join('')}</div>

        <div class="card margin-top" style="padding:1rem; border:1px solid rgba(99,102,241,0.3);">
          <div class="flex-between">
            <span class="panel-section-title" style="font-size:0.9rem;">🧠 Gemini setup review</span>
            <span class="sim-chip ${setupReview && setupReview.aiProvider === 'gemini-live' ? 'connected' : 'local'}">${setupReview ? (setupReview.aiProvider === 'gemini-live' ? 'LIVE GEMINI' : 'Deterministic fallback') : 'Reviewing…'}</span>
          </div>
          ${setupReview ? `
          <p style="color:#e2e8f0; font-size:0.85rem; margin-top:0.4rem;">${setupReview.summary}</p>
          ${(setupReview.recommendations || []).length ? setupReview.recommendations.map(r => `
            <div class="margin-top-xs" style="font-size:0.8rem; display:flex; gap:0.5rem; align-items:flex-start;">
              <span class="badge ${r.priority === 'high' ? 'badge-red' : r.priority === 'medium' ? 'badge-amber' : 'badge-blue'}" style="flex-shrink:0;">${(r.priority || '').toUpperCase()}</span>
              <span style="color:#c7d2fe;">${r.recommendation}</span>
            </div>`).join('') : `<p class="text-muted margin-top-xs" style="font-size:0.78rem;">No further gaps identified.</p>`}` :
          `<p class="text-muted margin-top-xs" style="font-size:0.8rem;">Reviewing your setup for gaps beyond the basic checklist…</p>`}
        </div>

        <div class="card margin-top" style="padding:1.25rem; text-align:center; border:1px solid ${requiredOk ? 'rgba(16,185,129,0.45)' : 'rgba(245,158,11,0.4)'};">
          ${requiredOk
            ? `<h3 style="color:#34d399; font-size:1.3rem;">Billi is ready.</h3>
               <p class="text-muted" style="font-size:0.82rem;">Activating arms continuous monitoring for ${esc((S.protectedPerson || {}).name || 'your protected person')}.</p>
               ${recommendedOpen.length ? `<p style="color:#fbbf24; font-size:0.76rem; margin-top:0.4rem;">${recommendedOpen.length} optional item(s) still open (${recommendedOpen.map(i => i.label).join(', ')}) — you can activate now and finish these anytime from Safety Contract, Network, or Devices.</p>` : ''}`
            : `<h3 style="color:#fbbf24; font-size:1.1rem;">Not ready yet</h3><p class="text-muted" style="font-size:0.82rem;">Complete the required items above — go back to the relevant step.</p>`}
        </div>`;
      }
    ];

    /* ---------- ACTIONS ---------- */
    function val(id) { const e = document.getElementById(id); return e ? e.value.trim() : ''; }

    function saveStep() {
      if (cur === 2) S.owner = { name: val('own-name'), role: val('own-role'), relationship: val('own-rel'), phone: val('own-phone') };
      if (cur === 3) S.protectedPerson = { name: val('pp-name'), age: val('pp-age'), facility: val('pp-fac') };
      if (cur === 4) S.medical = { conditions: val('md-cond'), allergies: val('md-alrg'), medications: val('md-meds'), equipment: val('md-meds'), physician: val('md-phys'), instructions: val('md-instr') };
      if (cur === 7) {
        const n = val('pin-norm'), d = val('pin-dur');
        if (n && d && n === d) { document.getElementById('pin-warn').innerText = 'Duress PIN must be different from the normal PIN.'; return false; }
        S.pins = { normal: n, duress: d };
      }
      Billi.save();
      return true;
    }

    function validateStep() {
      if (cur === 1 && !S.entityType) { Billi.toast('Choose an entity type to continue.', 'warn'); return false; }
      if (cur === 2 && !val('own-name')) { Billi.toast('Enter the account owner name.', 'warn'); return false; }
      if (cur === 3 && !val('pp-name')) { Billi.toast('Enter the protected person\'s name.', 'warn'); return false; }
      return true;
    }

    function goStep(n) {
      if (n < 1 || n > TOTAL_STEPS) return;
      saveStep();
      cur = n; S.setup.step = n; Billi.save(); render();
    }

    function nextStep() {
      if (!validateStep() || !saveStep()) return;
      if (cur === TOTAL_STEPS) {
        const readyItems = Billi.readiness();
        if (!readyItems.filter(i => i.required).every(i => i.ok)) { Billi.toast('A few essentials are still needed — resolve the required items first.', 'warn'); return; }
        const openOptional = readyItems.filter(i => !i.required && !i.ok);
        Billi.activatePlatform();
        Billi.toast(openOptional.length
          ? `✓ Billi is armed. ${openOptional.length} optional item(s) can be finished anytime in Settings.`
          : '✓ Billi is ready. Safety ecosystem armed.', 'ok');
        setTimeout(() => location.href = 'dashboard.html', 900);
        return;
      }
      goStep(cur + 1);
    }

    function addContact() {
      const name = val('tn-name');
      if (!name) { Billi.toast('Enter a contact name.', 'warn'); return; }
      S.contacts.push({
        id: Billi.uid('c'), name, relationship: val('tn-rel'), role: document.getElementById('tn-role').value,
        priority: parseInt(document.getElementById('tn-prio').value, 10), phone: val('tn-phone'),
        channels: ['Push', 'SMS'],
        notifyEnabled: document.getElementById('tn-notify').checked,
        canAcknowledge: document.getElementById('tn-ack').checked, canResolve: document.getElementById('tn-res').checked,
        medicalAccess: document.getElementById('tn-med').checked, evidenceAccess: false,
        locationAccess: true, duressVisibility: document.getElementById('tn-dur').checked, availability: 'Available'
      });
      Billi.save(); render();
      Billi.toast(`✓ ${name} added to Trusted Network.`, 'ok');
    }

    /* ---------- SAFE ZONE MAP (Leaflet + OpenStreetMap — real, no API key) ----------
       Click the map (or drag the marker, or tap "use my current location") to stage
       a pending zone; the radius slider live-resizes its circle. Nothing is saved
       to S.zones until "Save this location as a safe zone" is tapped — the map
       itself never writes state, matching the rest of this app's pattern of only
       persisting on an explicit user action. Re-initialized on every render of this
       step since step-host.innerHTML is fully replaced each time (same reason the
       rest of onboarding.html has no other persistent DOM). */
    let zoneMap = null, pendingZonePos = null, pendingMarker = null, pendingCircle = null;

    function initZoneMap() {
      const container = document.getElementById('zone-map');
      if (!container) return;
      if (zoneMap) { zoneMap.remove(); zoneMap = null; }
      pendingZonePos = null; pendingMarker = null; pendingCircle = null;
      if (typeof L === 'undefined') {
        container.innerHTML = '<p class="text-muted" style="padding:1rem;font-size:0.8rem;">Map library failed to load (no network access to unpkg.com) — you can still use "Use my current location" once it loads, or try again with a connection.</p>';
        return;
      }
      const zones = S.zones || [];
      const center = zones.length
        ? [zones.reduce((s, z) => s + z.lat, 0) / zones.length, zones.reduce((s, z) => s + z.lng, 0) / zones.length]
        : [39.5, -98.35]; // neutral fallback (continental US) until a real position is known
      zoneMap = L.map('zone-map').setView(center, zones.length ? 13 : 4);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors', maxZoom: 19
      }).addTo(zoneMap);

      /* Address/building search — routes results through the same
         placePendingZone() a map click uses, so search behaves exactly
         like clicking: a draggable pending pin, nothing saved to
         S.zones until the explicit Save tap. defaultMarkGeocode:false
         stops the plugin from adding its own separate marker. */
      if (typeof L.Control !== 'undefined' && L.Control.geocoder) {
        L.Control.geocoder({ defaultMarkGeocode: false, placeholder: 'Search an address or building…' })
          .on('markgeocode', (e) => {
            zoneMap.setView(e.geocode.center, 16);
            placePendingZone(e.geocode.center);
            const addrField = document.getElementById('zn-addr');
            if (addrField && !addrField.value) addrField.value = e.geocode.name;
          })
          .addTo(zoneMap);
      }

      zones.forEach(z => {
        L.circle([z.lat, z.lng], { radius: z.radius, color: '#6366f1', fillColor: '#6366f1', fillOpacity: 0.15 })
          .addTo(zoneMap).bindPopup(`<strong>${esc(z.name)}</strong><br>${z.radius}m radius`);
      });

      /* Silently recenter on the device's real position if we can get one and
         no zones exist yet to center on instead — never blocks map interaction
         either way, since the map already rendered with the fallback view. */
      if (!zones.length && navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          (pos) => { if (zoneMap) zoneMap.setView([pos.coords.latitude, pos.coords.longitude], 14); },
          () => {}, { timeout: 8000 }
        );
      }

      zoneMap.on('click', (e) => placePendingZone(e.latlng));

      /* The map is built in the same tick the step's innerHTML is replaced, so
         the container has not been laid out yet and Leaflet measures it as
         near-zero. It then only requests tiles for that phantom viewport and
         the map renders as flat grey — while circles still draw, because SVG
         overlays do not depend on tiles. Re-measuring on the next frame is the
         fix, and it has to run after paint, not just after innerHTML. */
      requestAnimationFrame(() => { if (zoneMap) zoneMap.invalidateSize(); });
      setTimeout(() => { if (zoneMap) zoneMap.invalidateSize(); }, 250);
    }

    /* Typing an address is how a person adds a place. The geocoder plugin put
       its search behind a small icon on the map, which nobody found — so this
       is a plain field and a button, using the same free Nominatim service. */
    function findAddress() {
      const input = document.getElementById('zn-search');
      const q = (input?.value || '').trim();
      if (!q) { Billi.toast('Type an address or a place name first.', 'warn'); return; }
      if (typeof L === 'undefined' || !L.Control || !L.Control.Geocoder) {
        Billi.toast('Address lookup is unavailable — no connection to the map service.', 'warn');
        return;
      }
      const btn = document.getElementById('zn-find-btn');
      if (btn) { btn.disabled = true; btn.innerText = 'Searching…'; }
      L.Control.Geocoder.nominatim().geocode(q, (results) => {
        if (btn) { btn.disabled = false; btn.innerText = 'Find it'; }
        if (!results || !results.length) {
          Billi.toast(`No match for "${q}". Try adding the city, or drop a pin on the map instead.`, 'warn');
          return;
        }
        const r = results[0];
        zoneMap.setView(r.center, 16);
        placePendingZone(r.center);
        const addr = document.getElementById('zn-addr');
        const name = document.getElementById('zn-name');
        if (addr) addr.value = r.name;
        if (name && !name.value) name.value = r.name.split(',')[0];
        Billi.toast('Found it. Adjust the size if you need to, then save.', 'ok');
      });
    }

    function placePendingZone(latlng) {
      pendingZonePos = latlng;
      const radius = parseInt(document.getElementById('zn-radius')?.value || '100', 10);
      if (pendingMarker) zoneMap.removeLayer(pendingMarker);
      if (pendingCircle) zoneMap.removeLayer(pendingCircle);
      pendingMarker = L.marker(latlng, { draggable: true }).addTo(zoneMap);
      pendingCircle = L.circle(latlng, { radius, color: '#22c55e', dashArray: '4', fillColor: '#22c55e', fillOpacity: 0.1 }).addTo(zoneMap);
      pendingMarker.on('drag', (e) => { pendingZonePos = e.target.getLatLng(); pendingCircle.setLatLng(pendingZonePos); });
      const label = document.getElementById('zn-pending-label');
      if (label) label.innerText = `Pending: ${latlng.lat.toFixed(4)}, ${latlng.lng.toFixed(4)} — drag the pin to fine-tune`;
    }

    function onZoneRadiusInput(value) {
      document.getElementById('zn-radius-val').innerText = value + ' m';
      if (pendingCircle) pendingCircle.setRadius(parseInt(value, 10));
    }

    function useCurrentLocationForZone() {
      if (!navigator.geolocation) { Billi.toast('This device does not support real GPS.', 'warn'); return; }
      Billi.toast('Getting your real location…', 'ok');
      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const ll = L.latLng(pos.coords.latitude, pos.coords.longitude);
          if (zoneMap) zoneMap.setView(ll, 16);
          placePendingZone(ll);
          Billi.toast(`✓ Using your real current location (±${Math.round(pos.coords.accuracy)}m accuracy). Now save it below.`, 'ok');
        },
        (err) => Billi.toast(`Could not get real location — ${err.message || 'permission denied or unavailable'}.`, 'warn'),
        { enableHighAccuracy: true, timeout: 15000 }
      );
    }

    function addZone() {
      const name = val('zn-name');
      if (!name) { Billi.toast('Enter a zone name.', 'warn'); return; }
      if (!pendingZonePos) { Billi.toast('Click the map (or use your current location) to place the zone first.', 'warn'); return; }
      const radius = parseInt(document.getElementById('zn-radius').value, 10);
      S.zones.push({
        id: Billi.uid('z'), name, address: val('zn-addr'),
        lat: pendingZonePos.lat, lng: pendingZonePos.lng,
        radius, active: true
      });
      Billi.save(); render();
      Billi.toast(`✓ Safe zone "${name}" saved.`, 'ok');
    }

    /* Reads the device actually in the user's hand. Every capability below is
       a genuine feature-detect against this browser — not a lookup table and
       not an assumption. It is what makes "register this device" mean
       something, where the catalog only ever added fixture hardware. */
    function detectThisDevice() {
      const ua = navigator.userAgent || '';
      const android = /Android/i.test(ua);
      const ios = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
      const mobile = android || ios || /Mobi/i.test(ua);
      const secure = window.isSecureContext;
      const media = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
      let name = 'This computer', type = 'Computer', icon = '💻';
      if (android) { name = 'This Android phone'; type = 'Phone (Primary Hub)'; icon = '📱'; }
      else if (ios) { name = 'This iPhone'; type = 'Phone (Primary Hub)'; icon = '📱'; }
      else if (mobile) { name = 'This phone'; type = 'Phone (Primary Hub)'; icon = '📱'; }
      return {
        name, type, icon, secure, android, ios, mobile,
        capabilities: [
          { label: 'Location', ok: !!navigator.geolocation && secure },
          { label: 'Microphone', ok: media && secure },
          { label: 'Camera', ok: media && secure },
          { label: 'Motion sensors', ok: typeof DeviceMotionEvent !== 'undefined' },
          { label: 'Vibration', ok: !!navigator.vibrate },
          { label: 'Text alerts from this phone', ok: !!window.BilliNative }
        ]
      };
    }

    /* Add a device you are not currently using. Registered honestly as
       NOT CONNECTED, because Billi is not running on it and cannot reach its
       sensors until it is — listing a phone is not the same as protecting
       with it, and the old catalog blurred that by adding fixture hardware
       (an iPhone, an Apple Watch) that the owner did not even own. */
    function addNamedDevice() {
      const name = (document.getElementById('dv-name')?.value || '').trim();
      const type = document.getElementById('dv-type')?.value || 'Other';
      if (!name) { Billi.toast('Give it a name so you can tell it apart later.', 'warn'); return; }
      if (S.devices.some(d => d.name.toLowerCase() === name.toLowerCase())) {
        Billi.toast(`${name} is already on your list.`, 'warn'); return;
      }
      S.devices.push({
        id: Billi.uid('d'), name, type, state: 'OFFLINE',
        battery: null, capabilities: [], triggers: [], lastSeen: 'not connected yet'
      });
      Billi.save(); render();
      Billi.toast(`Added ${name}. Open Billi on it and tap "Register this device" to connect its sensors.`, 'ok');
    }

    function registerThisDevice() {
      if (S.devices.some(d => d.thisDevice)) { Billi.toast('This device is already registered.', 'warn'); return; }
      const d = detectThisDevice();
      S.devices.unshift({
        id: Billi.uid('d'),
        name: d.name.replace(/^This /, 'My '),
        type: d.type,
        thisDevice: true,
        state: 'CONNECTED',
        battery: null,
        capabilities: d.capabilities.filter(c => c.ok).map(c => c.label),
        triggers: ['Hold-to-SOS', 'Safe word', 'Accessibility shortcut'],
        lastSeen: 'now'
      });
      Billi.save(); render();
      const live = d.capabilities.filter(c => c.ok).length;
      Billi.toast(`✓ Registered — ${live} of ${d.capabilities.length} capabilities available on this device.`, 'ok');
    }

    function registerDevice(name, type, st) {
      if (S.devices.find(d => d.name === name)) { Billi.toast(`${name} is already registered.`, 'warn'); return; }
      const cat = Billi.FIXTURE.devices.find(d => d.name === name);
      S.devices.push(cat ? { ...cat, id: Billi.uid('d') } : { id: Billi.uid('d'), name, type, state: st, battery: 80, capabilities: [], triggers: [], lastSeen: 'now' });
      Billi.save(); render();
      Billi.toast(`✓ ${name} registered (${st}).`, 'ok');
    }

    function bleScan() {
      Billi.toast('📶 BLE scan: 9 compatible devices found — register them from the catalog below.', 'ok');
    }

    /* REAL voice enrollment. This used to be three setTimeouts that walked a
       label from "Recording" to "Enrolled" without touching a microphone —
       a feature that existed only as text. It now opens the actual mic,
       records with MediaRecorder, keeps the audio so you can play back
       exactly what Billi captured, and refuses to mark itself enrolled if
       nothing was recorded.

       What it is honestly NOT: speaker-recognition training. Billi stores
       your recording so a guardian can hear the phrase in your own voice;
       it does not build a biometric voiceprint model. The UI says that. */
    let voiceRec = { recorder: null, stream: null, chunks: [], url: null, timer: null };

    async function calibrateVoice() {
      if (voiceRec.recorder && voiceRec.recorder.state === 'recording') return stopVoiceRecording();
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        Billi.toast('This browser cannot record audio. Try Chrome, and make sure the page is on HTTPS.', 'warn');
        return;
      }
      try {
        voiceRec.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (e) {
        S.voice.state = 'Microphone blocked'; Billi.save(); render();
        Billi.toast('Microphone permission was refused, so nothing was recorded.', 'warn');
        return;
      }
      voiceRec.chunks = [];
      voiceRec.recorder = new MediaRecorder(voiceRec.stream);
      voiceRec.recorder.ondataavailable = (e) => { if (e.data && e.data.size) voiceRec.chunks.push(e.data); };
      voiceRec.recorder.onstop = () => {
        (voiceRec.stream.getTracks() || []).forEach(t => t.stop());
        const blob = new Blob(voiceRec.chunks, { type: voiceRec.recorder.mimeType || 'audio/webm' });
        if (!blob.size) {
          S.voice.state = 'Not enrolled'; Billi.save(); render();
          Billi.toast('Nothing was captured — no audio reached the microphone.', 'warn');
          return;
        }
        if (voiceRec.url) URL.revokeObjectURL(voiceRec.url);
        voiceRec.url = URL.createObjectURL(blob);
        S.voice.state = 'Enrolled';
        S.voice.recordedAt = Date.now();
        S.voice.bytes = blob.size;
        Billi.save(); render();
        Billi.toast(`✓ Recorded ${(blob.size / 1024).toFixed(1)} KB — play it back to hear what Billi captured.`, 'ok');
      };
      voiceRec.recorder.start();
      S.voice.state = 'Recording…'; Billi.save(); render();
      /* Hard stop so a forgotten tab cannot hold the mic open indefinitely. */
      voiceRec.timer = setTimeout(stopVoiceRecording, 6000);
    }

    function stopVoiceRecording() {
      clearTimeout(voiceRec.timer);
      if (voiceRec.recorder && voiceRec.recorder.state === 'recording') voiceRec.recorder.stop();
    }

    function playVoiceback() {
      if (!voiceRec.url) { Billi.toast('Nothing recorded in this session yet — record first.', 'warn'); return; }
      new Audio(voiceRec.url).play();
    }

    /* The whole point of quick-fill is to skip typing — so it jumps to the
       final step rather than leaving you on step 1 looking at a page that
       hasn't visibly changed. It used to fill state and call render(), which
       on step 1 (a chooser with no text fields) looked exactly like nothing
       had happened: same "Step 1 of 10", same "0% Complete". */
    function prefillDemo() {
      Billi.applyFixturePrefill();
      goStep(1);
      Billi.toast('⚡ All 10 steps filled. Use the numbered strip above to jump to any of them — nothing left to type.', 'ok');
    }

    /* Straight to activation, for when the point is the dashboard rather than
       the setup. Fills first if the account is still empty, so it works from
       a cold start in one click. */
    function skipToActivation() {
      if (!S.protectedPerson || !S.contacts.length) Billi.applyFixturePrefill();
      goStep(TOTAL_STEPS);
      Billi.toast('Ready to activate — everything required is already green.', 'ok');
    }

    render();
  </script>
</body>
</html>
