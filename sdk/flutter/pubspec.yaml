name: billi_sdk
description: "Billi Safety Orchestration Platform - Core SDK for Mobile & Enterprise Adapters"
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cloud_firestore: ^4.15.5
  firebase_core: ^2.27.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.billi.sdk
        pluginClass: BilliSdkPlugin
      ios:
        pluginClass: BilliSdkPlugin
